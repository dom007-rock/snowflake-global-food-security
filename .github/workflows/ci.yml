name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ===========================================================================
  # PYTHON QUALITY
  # ===========================================================================

  python-quality:
    name: Python quality checks

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install \
            pandas \
            pytest \
            ruff

      - name: Compile Python
        run: |
          python -m compileall \
            src \
            scripts \
            streamlit \
            tests

      - name: Ruff lint
        run: |
          ruff check \
            src \
            scripts \
            streamlit \
            tests


  # ===========================================================================
  # SQL VALIDATION
  # ===========================================================================

  sql-validation:
    name: SQL validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run SQL validation
        run: |
          python scripts/ci/validate_sql.py


  # ===========================================================================
  # AUTOMATED TESTS
  # ===========================================================================

  automated-tests:
    name: Automated tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install test dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install \
            pandas \
            pytest

      - name: Run tests
        run: |
          pytest -v tests/